name = "life-tracker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "life-tracker"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "life-tracker-data"

[triggers]
crons = ["0 9 * * *"]   # nightly full-JSON backup to R2

[vars]
TZ_NAME = "America/Chicago"      # your IANA timezone; used for "today" on voice logs
MODEL = "claude-sonnet-5-5"
# Secrets (set with `wrangler secret put`): APP_TOKEN, ANTHROPIC_API_KEY
