<style>
/* Layout: a calm instrument. One living landscape fills the frame; everything else is typography on hairlines.
   Colour has jobs: warm ramp = health (ember→copper→amber→gold), verdigris = what the AI knows or predicts, ivory = structure, steel = dormant. */
:root {
  color-scheme: dark;
  --obsidian: #07080a; --charcoal: #0e1012; --graphite: #1a1d21; --line: rgba(239, 230, 212, 0.1); --line2: rgba(239, 230, 212, 0.2);
  --ivory: #efe6d4; --dim: #b3aa98; --muted: #8a8372; --amber: #e3a24a; --copper: #c8794a; --ember: #d2562a; --verd: #6fb0a3; --steel: #8d9aa8;
  --disp: "Fraunces", Georgia, serif; --ui: "Instrument Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--obsidian); margin: 0; }
body { color: var(--ivory); font: 13px/1.45 var(--ui); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 1px solid var(--amber); outline-offset: 3px; }
canvas { display: block; }
#stage { position: relative; width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 36px; padding-block: 18px; }
.dev { position: relative; flex: none; background: var(--obsidian); overflow: hidden; transform-origin: top left; }
#deskBox, #phoneBox { position: relative; flex: none; }
#desk { width: 1440px; height: 900px; border: 1px solid var(--line); box-shadow: 0 40px 120px -30px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(0, 0, 0, 0.6); border-radius: 14px; }
#phone { width: 390px; height: 844px; border-radius: 52px; border: 1px solid var(--line2); box-shadow: 0 40px 120px -30px rgba(0, 0, 0, 0.9), 0 0 0 9px #101214, 0 0 0 10px var(--line); }
.lab { font: 500 10px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.hair { border-top: 1px solid var(--line); }

/* ---------- desktop ---------- */
#dc { position: absolute; inset: 0; width: 100%; height: 100%; }
.bar { position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 22px; padding: 0 28px; border-bottom: 1px solid var(--line); background: linear-gradient(rgba(7, 8, 10, 0.85), rgba(7, 8, 10, 0.4)); z-index: 5; }
.mark { display: flex; align-items: center; gap: 10px; font: 400 19px var(--disp); letter-spacing: 0.04em; }
.crumbs { display: flex; align-items: center; gap: 2px; font: 500 11px var(--mono); letter-spacing: 0.06em; color: var(--muted); min-width: 0; }
.crumbs button { padding: 4px 7px; color: var(--dim); border-radius: 2px; text-transform: uppercase; } .crumbs button:hover { color: var(--ivory); } .crumbs button.on { color: var(--amber); } .crumbs i { color: var(--muted); font-style: normal; opacity: 0.5; }
.sw { display: flex; gap: 0; border: 1px solid var(--line2); border-radius: 2px; } .sw button { padding: 5px 11px; font: 500 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); } .sw button.on { color: var(--obsidian); background: var(--ivory); } .sw button:not(.on):hover { color: var(--ivory); }
.tog { font: 500 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 7px; padding: 5px 2px; } .tog i { width: 7px; height: 7px; border: 1px solid var(--muted); border-radius: 50%; } .tog.on { color: var(--ivory); } .tog.on i { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 8px var(--amber); } .tog.v.on i { background: var(--verd); border-color: var(--verd); box-shadow: 0 0 8px var(--verd); }
.grow { flex: 1; min-width: 0; }
.strip { position: absolute; left: 28px; width: 1048px; top: 62px; height: 118px; display: flex; align-items: stretch; z-index: 4; pointer-events: none; }
.strip > * { pointer-events: auto; }
#core { width: 118px; height: 118px; flex: none; }

.ro .v { font: 300 33px/1 var(--disp); letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 3px; } .ro .v small { font: 500 11px var(--mono); color: var(--muted); letter-spacing: 0; }
.ro canvas { width: 100%; height: 26px; margin-top: 2px; } .ro .d { font: 500 10px var(--mono); color: var(--muted); } .ro .d.up { color: var(--amber); } .ro .d.dn { color: var(--ember); }
.rt { position: absolute; right: 0; top: 52px; bottom: 0; width: 340px; border-left: 1px solid var(--line); background: linear-gradient(90deg, rgba(7, 8, 10, 0.55), rgba(7, 8, 10, 0.9)); display: flex; flex-direction: column; z-index: 4; }
.sec { padding: 18px 24px 14px; border-bottom: 1px solid var(--line); } .sec .lab { display: flex; justify-content: space-between; margin-bottom: 12px; } .sec .lab b { color: var(--verd); font-weight: 500; }
.focus h3 { margin: 0 0 8px; font: 400 21px/1.2 var(--disp); letter-spacing: -0.005em; text-wrap: balance; } .focus p { margin: 0 0 14px; color: var(--dim); font-size: 12.5px; line-height: 1.55; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border: 1px solid var(--line2); border-radius: 2px; font: 600 10.5px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ivory); transition: border-color .2s, background .2s; } .btn:hover { border-color: var(--amber); background: rgba(227, 162, 74, 0.08); } .btn.pri { border-color: rgba(227, 162, 74, 0.7); color: var(--amber); } .btn.v { border-color: rgba(111, 176, 163, 0.6); color: var(--verd); } .btn.v:hover { background: rgba(111, 176, 163, 0.1); border-color: var(--verd); }
.sig { list-style: none; margin: 0; padding: 0; } .sig li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; } .sig li:hover .t { color: var(--amber); } .sig li.on .t { color: var(--amber); } .sig canvas { width: 34px; height: 22px; } .sig .t { font: 500 12.5px var(--ui); color: var(--ivory); transition: color .2s; } .sig .m { font: 500 9.5px var(--mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.steps { list-style: none; margin: 0; padding: 0; } .steps li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; opacity: 0.45; transition: opacity .3s; } .steps li.on { opacity: 1; } .steps li.done { opacity: 0.7; } .steps .n { font: 500 10px var(--mono); color: var(--verd); padding-top: 2px; } .steps .c { color: var(--ivory); font-size: 12px; line-height: 1.4; } .steps .c small { display: block; color: var(--muted); font: 500 10px var(--mono); margin-top: 3px; letter-spacing: 0.04em; }
.prog { height: 1px; background: var(--line); margin: 4px 0 6px; position: relative; } .prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--verd); box-shadow: 0 0 8px var(--verd); }
.attn { list-style: none; margin: 0; padding: 0; } .attn li { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer; } .attn .t { font-size: 12.5px; } .attn .r { font: 500 9.5px var(--mono); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; } .attn canvas { width: 20px; height: 20px; } .attn li.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(138, 131, 114, 0.5); } .attn li:hover .t { color: var(--amber); }
.ask { margin-top: auto; border-bottom: 0; } .askrow { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line2); padding-bottom: 9px; } .askrow input { flex: 1; background: none; border: 0; color: var(--ivory); font: 400 13.5px var(--ui); } .askrow input::placeholder { color: var(--muted); } .askrow .k { font: 500 10px var(--mono); color: var(--muted); border: 1px solid var(--line2); padding: 2px 5px; border-radius: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; } .chips button { font: 500 10px var(--mono); letter-spacing: 0.06em; padding: 4px 8px; border: 1px solid var(--line); border-radius: 2px; color: var(--dim); } .chips button:hover { color: var(--ivory); border-color: var(--line2); }
#answer { margin-top: 12px; color: var(--ivory); font-size: 12.5px; line-height: 1.55; } #answer .lead { color: var(--verd); font: 500 10px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; display: block; margin-bottom: 4px; } .shim { height: 9px; border-radius: 2px; margin: 7px 0; background: linear-gradient(90deg, var(--line), rgba(111, 176, 163, 0.3), var(--line)); background-size: 200% 100%; animation: shim 1.3s linear infinite; } @keyframes shim { to { background-position: -200% 0; } }
.foot { position: absolute; left: 0; right: 340px; bottom: 0; height: 108px; z-index: 4; display: flex; gap: 0; padding: 0 28px; }
.legend { width: 340px; padding-top: 14px; flex: none; } .legend ul { list-style: none; margin: 7px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; } .legend li { display: grid; grid-template-columns: 26px 1fr; gap: 7px; align-items: center; color: var(--dim); font-size: 10.5px; white-space: nowrap; } .legend canvas { width: 26px; height: 14px; }
.scrub { flex: 1; padding: 14px 0 0 24px; position: relative; } #mm { width: 100%; height: 46px; cursor: ew-resize; touch-action: none; }
.scale { display: flex; justify-content: space-between; margin-top: 7px; }
.scale button { font: 500 10px var(--mono); letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; padding: 2px 6px; } .scale button:hover { color: var(--ivory); } .scale button.on { color: var(--amber); }
.tour { position: absolute; left: 420px; top: 10px; z-index: 6; padding: 6px 11px; } .cap { position: absolute; left: 150px; width: 926px; bottom: 146px; text-align: center; z-index: 6; pointer-events: none; font: 300 22px var(--disp); letter-spacing: 0.01em; color: var(--ivory); opacity: 0; transition: opacity .7s; text-shadow: 0 2px 30px #000; } .cap.on { opacity: 1; }
.tip { position: absolute; z-index: 7; pointer-events: none; min-width: 190px; max-width: 250px; padding: 10px 12px; background: rgba(14, 16, 18, 0.94); border: 1px solid var(--line2); opacity: 0; transition: opacity .15s; } .tip.on { opacity: 1; } .tip b { display: block; font: 500 13px var(--ui); margin-bottom: 2px; } .tip .s { color: var(--muted); font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; } .tip .r { margin-top: 7px; display: flex; justify-content: space-between; font: 500 11px var(--mono); color: var(--dim); }
@media (prefers-reduced-motion: reduce) { .shim { animation: none; } }
.playing .focus p, .playing #focusBox > div:last-child { display: none; } .playing .focus h3 { font-size: 17px; margin-bottom: 0; } .playing.sec { padding-bottom: 8px; }
.cap { background: radial-gradient(ellipse at 50% 100%, rgba(7,8,10,.92), rgba(7,8,10,0) 70%); padding: 18px 0 8px; }
/* ---------- iPhone portal ---------- */
#phone { --top: 54px; --bot: 26px; display: flex; flex-direction: column; background: radial-gradient(120% 60% at 50% 0%, #14100c 0%, var(--obsidian) 55%); }
#phone .sb { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px; font: 600 14px var(--ui); z-index: 8; pointer-events: none; }
#phone .island { position: absolute; left: 50%; top: 11px; width: 110px; height: 30px; margin-left: -55px; background: #000; border-radius: 20px; z-index: 9; }
.m-head { padding: calc(var(--top) + 2px) 22px 0; display: flex; align-items: center; justify-content: space-between; flex: none; }
.m-head .mark { font-size: 17px; } .m-head .when { font: 500 10px var(--mono); letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
.m-head canvas { width: 46px; height: 46px; }
.m-say { padding: 6px 22px 0; flex: none; } .m-say h2 { margin: 0; font: 300 25px/1.18 var(--disp); letter-spacing: -0.01em; text-wrap: balance; } .m-say h2 em { font-style: normal; color: var(--amber); } .m-say p { margin: 6px 0 0; font: 500 10px var(--mono); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.m-hero { position: relative; flex: none; margin-top: 2px; touch-action: pan-y; } .m-hero canvas { width: 100%; display: block; } .m-hero .hint { position: absolute; left: 22px; bottom: 6px; font: 500 9px var(--mono); letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; pointer-events: none; }
.m-time { flex: none; padding: 0 22px; } .m-time canvas { width: 100%; height: 44px; touch-action: none; cursor: ew-resize; } .m-time .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.m-time .rng { font: 500 10px var(--mono); letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; } .m-time .ch { display: flex; gap: 2px; } .m-time .ch button { font: 500 10px var(--mono); letter-spacing: 0.08em; color: var(--muted); padding: 5px 7px; border-radius: 2px; text-transform: uppercase; } .m-time .ch button.on { color: var(--obsidian); background: var(--ivory); }
.m-low { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 22px 96px; scrollbar-width: none; -webkit-overflow-scrolling: touch; } .m-low::-webkit-scrollbar { display: none; }
.m-ai { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 13px 0 14px; position: relative; }
.m-ai .lab { color: var(--verd); display: flex; justify-content: space-between; margin-bottom: 7px; } .m-ai h3 { margin: 0 0 4px; font: 400 18px/1.25 var(--disp); text-wrap: balance; } .m-ai p { margin: 0 0 11px; color: var(--dim); font-size: 12.5px; line-height: 1.5; }
.m-ai .btns { display: flex; gap: 8px; } .m-ai .btn { padding: 8px 12px; }
.m-sec { margin-top: 14px; } .m-sec .lab { display: flex; justify-content: space-between; margin-bottom: 6px; }
.m-today { list-style: none; margin: 0; padding: 0; } .m-today li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent; } .m-today canvas { width: 26px; height: 26px; } .m-today .t { font-size: 14px; } .m-today .r { font: 500 9.5px var(--mono); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; } .m-today li.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(138, 131, 114, 0.5); }
.m-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 18px calc(var(--bot) + 6px); background: linear-gradient(rgba(7, 8, 10, 0), rgba(7, 8, 10, 0.94) 38%); z-index: 6; display: flex; gap: 10px; }
.m-pill { flex: 1; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border: 1px solid var(--line2); border-radius: 23px; background: rgba(14, 16, 18, 0.9); color: var(--dim); font: 400 14px var(--ui); text-align: left; } .m-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--verd); box-shadow: 0 0 10px var(--verd); animation: bre 2.6s ease-in-out infinite; } @keyframes bre { 50% { opacity: 0.35; } }
.m-ex { width: 46px; height: 46px; border: 1px solid var(--line2); border-radius: 50%; background: rgba(14, 16, 18, 0.9); display: grid; place-items: center; } .m-ex svg { display: block; }
.m-sheet { position: absolute; inset: 0; z-index: 10; pointer-events: none; } .m-sheet .veil { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55); opacity: 0; transition: opacity .35s; } .m-sheet .pan { position: absolute; left: 0; right: 0; bottom: 0; top: 150px; background: #0b0c0e; border-top: 1px solid var(--line2); border-radius: 22px 22px 0 0; transform: translateY(105%); transition: transform .5s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column; box-shadow: 0 -30px 60px rgba(0, 0, 0, 0.6); }
.m-sheet.open { pointer-events: auto; } .m-sheet.open .veil { opacity: 1; } .m-sheet.open .pan { transform: none; }
.m-sheet .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line2); margin: 8px auto 4px; flex: none; } .m-sheet .sh { padding: 4px 22px 0; flex: none; display: flex; justify-content: space-between; align-items: center; } .m-sheet .sh button { font: 500 10px var(--mono); letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; padding: 6px 0; }
.m-sheet canvas.t { width: 100%; display: block; flex: none; } .m-sheet .sb2 { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px calc(var(--bot) + 14px); scrollbar-width: none; } .m-sheet .sb2::-webkit-scrollbar { display: none; }

.m-sheet input { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line2); color: var(--ivory); font: 400 17px var(--ui); padding: 10px 0; outline: 0; } .m-sheet .chips { margin: 12px 0; } .m-sheet #mAns { color: var(--ivory); font-size: 14px; line-height: 1.55; margin-top: 8px; }

</style>

<body>
<div id="stage">
  <div id="deskBox"><section id="desk" class="dev" aria-label="Desktop concept">
    <canvas id="dc"></canvas>
    <header class="bar">
      <div class="mark"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#efe6d4" stroke-width="1"><circle cx="11" cy="11" r="9.5" opacity=".35"/><ellipse cx="11" cy="11" rx="9.5" ry="3.8" transform="rotate(-24 11 11)" opacity=".8"/><circle cx="11" cy="11" r="2" fill="#e3a24a" stroke="none"/><circle cx="18.4" cy="7.6" r="1.4" fill="#efe6d4" stroke="none"/></svg>Orrery</div>
      <nav class="crumbs" id="crumbs" aria-label="Zoom level"></nav>

    </header>
    <div class="strip" id="strip">
      <canvas id="core" width="118" height="118"></canvas>
      <div class="ro" id="roC"><span class="lab">Completion</span><div class="v"><span></span><small>%</small></div><canvas></canvas><span class="d"></span></div>
      <div class="ro" id="roK"><span class="lab">Consistency</span><div class="v"><span></span><small>/100</small></div><canvas></canvas><span class="d"></span></div>
      <div class="ro" id="roM"><span class="lab">Momentum</span><div class="v"><span></span><small>pts/wk</small></div><canvas></canvas><span class="d"></span></div>
      <div class="ro" id="roF"><span class="lab">Friction</span><div class="v"><span></span><small>/100</small></div><canvas></canvas><span class="d"></span></div>
      <div class="ro" id="roS"><span class="lab">On-track run</span><div class="v"><span></span><small>cards</small></div><canvas></canvas><span class="d"></span></div>
    </div>

  </section></div>
  <div id="phoneBox"><section id="phone" class="dev" aria-label="iPhone concept"></section></div>
</div>

<script>
(function(){
"use strict";
// ================================================================ DATA: three years of sample household behavior, and the analysis on top of it

    li.onclick = () => { const was = a.done; completeTask(a); if (!was) { const n = (P.st._nodes || []).find((n) => n.id === a.t.id) || (P.st._cl || []).find((c) => c.i === a.t.ri); if (n) { P.st.ripples.push({ x: n.x, y: n.y, t0: CLK.t, s: 1 }); P.st.hoverTask = null; } if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) { /* no haptics */ } } };
    ul.appendChild(li); });
}
renderMobAttn();

// ---- time: the window slides; the hero constellation is always "this window"
function setWin(span, centre) { const hi = WEEKS * 7 + FC_WEEKS * 7, end = clamp((centre ?? (P.st.t0.t + P.st.t1.t) / 2) + span / 2, span, hi); P.span = span; P.st.t0.to(end - span); P.st.t1.to(end); }
P.st.mode.to(1, true); P.st.rowA.forEach((t) => t.to(1, true)); P.st.t0.to(NOW_DAY - 84, true); P.st.t1.to(NOW_DAY + 0.5, true);
$('#mCh').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; [...$('#mCh').children].forEach((x) => x.classList.toggle('on', x === b)); const s = +b.dataset.s; setWin(Math.min(s, NOW_DAY), s >= 1148 ? NOW_DAY / 2 : NOW_DAY - s / 2 + 0.5 + (s < 100 ? 0 : 0)); };
let tdrag = false;
const tDay = (e) => { const r = mTimeC.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1) * (WEEKS * 7 + FC_WEEKS * 7); };
mTimeC.addEventListener('pointerdown', (e) => { tdrag = true; mTimeC.setPointerCapture(e.pointerId); setWin(P.span, Math.min(tDay(e), NOW_DAY - P.span / 2 + P.span / 2)); });
mTimeC.addEventListener('pointermove', (e) => { if (tdrag) setWin(P.span, tDay(e)); }); mTimeC.addEventListener('pointerup', () => (tdrag = false));
// swipe on the hero steps through time by a quarter window
let sw = null; const hero = $('#mHero');
hero.addEventListener('pointerdown', (e) => { sw = { x: e.clientX, y: e.clientY, c: (P.st.t0.t + P.st.t1.t) / 2, moved: false }; });
hero.addEventListener('pointermove', (e) => { if (!sw) return; const dx = e.clientX - sw.x; if (Math.abs(dx) > 10) { sw.moved = true; setWin(P.span, sw.c - (dx / P.W) * P.span * 1.2); } });
hero.addEventListener('pointerup', (e) => { const s = sw; sw = null; if (!s || s.moved) return; const r = mHeroC.getBoundingClientRect(), p = { x: e.clientX - r.left, y: e.clientY - r.top }, h = constHit(P.st, p.x, p.y);
  if (h && h.kind === 'cluster') { P.st.clusterFocus = P.st.clusterFocus === h.i ? -1 : h.i; P.st.zoomC.to(P.st.clusterFocus >= 0 ? 1 : 0); P.st.cEmph.forEach((t, i) => t.to(P.st.clusterFocus < 0 || i === P.st.clusterFocus ? 1 : 0.3)); }
  else if (h && h.kind === 'task') { P.st.hoverTask = P.st.hoverTask === h.id ? null : h.id; P.st.ripples.push({ x: h.x, y: h.y, t0: CLK.t, s: 0.8 }); }
  else { P.st.clusterFocus = -1; P.st.zoomC.to(0); P.st.cEmph.forEach((t) => t.to(1)); P.st.hoverTask = null; } });

// ---- sheet: why / ask / explore, all drawn on the same terrain
const sheet = $('#mSheet'), sb = $('#mSb');
function openSheet(kind, ins) {
  P.open = kind; sheet.classList.add('open'); clearTimeout(P.timer); sb.innerHTML = ''; const ss = P.ss;
  ss.mode.to(0, true); ss.rowsKind = 'rooms'; ss.t0.to(NOW_DAY - 7 * 52, true); ss.t1.to(NOW_DAY + 7 * 6, true); ss.rowA.forEach((t) => t.to(1, true)); ss.plan.to(0, true); ss.fc.to(0.55, true); ss.band.s.to(0, true); ss.links = []; ss.callouts = []; ss.cLinks = [];
  if (kind === 'why') { P.ins = ins; $('#mShT').textContent = ins.tag + ' · ' + pct(ins.conf) + '% confident'; sb.innerHTML = '<div class="dots" id="mDots"></div><div class="cap2" id="mCap"></div><div class="nav"><button class="btn" id="mPrev">← Back</button><button class="btn v" id="mNx">Next →</button></div>'; $('#mPrev').onclick = () => stepM(P.stepI - 1); $('#mNx').onclick = () => stepM(P.stepI + 1); stepM(0); }
  else if (kind === 'ask') { $('#mShT').textContent = 'Ask'; sb.innerHTML = '<input id="mQ" placeholder="Ask about what you’re looking at" autocomplete="off"><div class="chips" id="mChips"></div><div id="mAns"></div>'; ['Why is Friday dropping?', 'What happens at holidays?', 'What’s linked?', 'What do I keep missing?'].forEach((q) => { const b = el('button', '', q); b.onclick = () => askM(q); $('#mChips').appendChild(b); }); $('#mQ').addEventListener('keydown', (e) => { if (e.key === 'Enter') askM(e.target.value); }); }
  else { $('#mShT').textContent = 'The whole landscape'; sb.innerHTML = '<div class="cap2" style="font-size:17px;min-height:0">Height is completion, colour is momentum. Drag along the bar to move through three years.</div><div class="chips" id="mRows"><button class="on">Rooms</button><button>Day pairs</button></div>'; $('#mRows').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; [...$('#mRows').children].forEach((x) => x.classList.toggle('on', x === b)); ss.rowsKind = b.textContent === 'Rooms' ? 'rooms' : 'pairs'; ss.rowA.forEach((t, i) => t.to(ss.rowsKind === 'pairs' && i > 2 ? 0 : 1)); }; }
}
function stepM(i) {
  const steps = P.ins.steps; if (i < 0) i = 0; if (i >= steps.length) { closeSheet(); return; } P.stepI = i; const s = steps[i], ss = P.ss;
  const sm = { ...s, mode: 0 }; applyStep(ss, sm); const cap = $('#mCap'); cap.style.opacity = 0; setTimeout(() => { cap.textContent = s.cap; cap.style.opacity = 1; }, 200);
  $('#mDots').innerHTML = steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join(''); $('#mNx').textContent = i === steps.length - 1 ? 'Done' : 'Next →';
  clearTimeout(P.timer); P.timer = setTimeout(() => { if (P.open === 'why') stepM(i + 1); }, 7500);
}
function askM(q) { const a = answerFor(q), ans = $('#mAns'); ans.innerHTML = '<span class="lead" style="color:var(--verd);font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:6px">Reading your data</span><div class="shim" style="width:90%"></div><div class="shim" style="width:64%"></div>'; setTimeout(() => { const ins = INSIGHTS.find((x) => x.id === a.id); ans.innerHTML = `<span class="lead" style="color:var(--verd);font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:6px">${ins.tag} · shown above</span>${a.text}<div style="margin-top:12px"><button class="btn v" id="mGo">Walk me through it →</button></div>`; $('#mGo').onclick = () => openSheet('why', ins); const ss = P.ss; applyStep(ss, { ...ins.steps[Math.min(1, ins.steps.length - 1)], mode: 0 }); }, 800); }
function closeSheet() { P.open = null; sheet.classList.remove('open'); clearTimeout(P.timer); }
$('#mWhy').onclick = () => openSheet('why', INSIGHTS[mi % INSIGHTS.length]); $('#mAsk').onclick = () => openSheet('ask'); $('#mEx').onclick = () => openSheet('explore'); $('#mClose').onclick = closeSheet; $('#mVeil').onclick = closeSheet;

// ---- draw
function drawMobile() {
  if (!M.hg) return; const st = P.st, g = M.hg;
  stepState(st, CLK.dt); prune(st); P.ss.mode.to(0); stepState(P.ss, CLK.dt); prune(P.ss);
  const R = { x: 0, y: 2, w: P.W, h: P.HH - 28 };
  g.clearRect(0, 0, P.W, P.HH); drawConst(g, st, R, { alpha: 1 });
  // time strip
  const tg = M.tg, w = P.W - 44; tg.clearRect(0, 0, w, 44); drawMinimap(tg, st, { x: 0, y: 4, w, h: 36 });
  const a = new Date(dateAt(Math.max(0, st.t0.v))), b = new Date(dateAt(Math.min(WEEKS * 7 - 1, st.t1.v))), f = (d) => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: '2-digit' }); $('#mRng').textContent = `${f(a)} – ${f(b)}`;
  // sheet terrain
  if (P.open) { const sg = M.sg, ss = P.ss; sg.clearRect(0, 0, P.W, M.sh); sg.fillStyle = INK.obsidian; sg.fillRect(0, 0, P.W, M.sh); const rr = { x: 62, y: 52, w: P.W - 80, h: M.sh - 88 }; drawTerrain(sg, ss, rr, {}); drawTerrainOverlay(sg, ss, rr, {}); }
  drawCore(M.cg, CLK.t, 46);
}


})();
