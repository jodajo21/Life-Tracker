name = "orrery"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "orrery"
database_id = "REPLACE_WITH_ID_FROM_SETUP"      # `npm run setup` fills this in
migrations_dir = "migrations"

[triggers]
crons = ["30 9 * * *"]                            # daily tidy-up of deleted rows

[vars]
TZ_NAME = "America/Chicago"                       # your IANA time zone; used for "today" when Siri logs something
MODEL = "claude-sonnet-5-5"                       # photos, Ask
MODEL_QUICK = "claude-haiku-5-5"                  # logging by text or voice, the room planner
DAILY_CALL_LIMIT = "300"                          # a safety stop on Claude calls per day
# Secrets (set by `npm run setup`): APP_TOKEN, ANTHROPIC_API_KEY
